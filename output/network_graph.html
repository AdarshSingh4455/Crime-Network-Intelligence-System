<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Criminal Network Link Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  body { margin:0; font-family: -apple-system, Arial, sans-serif; background:#0f1117; color:#eee; }
  #header { padding: 14px 20px; background:#161a23; border-bottom:1px solid #2a2f3a; }
  #header h1 { font-size:16px; margin:0; }
  #header p { font-size:12px; color:#9aa; margin:4px 0 0; }
  .legend { display:flex; gap:14px; padding:8px 20px; font-size:11px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .swatch { width:10px; height:10px; border-radius:50%; display:inline-block; }
  svg { width:100vw; height:calc(100vh - 90px); background:#0f1117; }
  .link { stroke:#555; }
  .node text { fill:#eee; font-size:10px; pointer-events:none; }
  .tooltip { position:absolute; background:#1c2029; border:1px solid #333; padding:6px 10px;
              border-radius:6px; font-size:12px; pointer-events:none; opacity:0; }
</style>
</head>
<body>
<div id="header">
  <h1>Criminal Network Analysis - Link Chart</h1>
  <p>Node size = investigative influence score &nbsp;|&nbsp; edge thickness = number of corroborating records</p>
</div>
<div class="legend"><span><span class="swatch" style="background:#e63946"></span>PERSON</span><span><span class="swatch" style="background:#457b9d"></span>ORG</span><span><span class="swatch" style="background:#2a9d8f"></span>LOCATION</span><span><span class="swatch" style="background:#f4a261"></span>VEHICLE</span><span><span class="swatch" style="background:#8d99ae"></span>PHONE</span><span><span class="swatch" style="background:#6a4c93"></span>MONEY</span></div>
<div class="tooltip" id="tooltip"></div>
<svg></svg>
<script>
const graph = {"nodes": [{"id": "MH12AB1234", "type": "VEHICLE", "color": "#f4a261", "score": 0.0}, {"id": "9876543210", "type": "PHONE", "color": "#8d99ae", "score": 0.0}, {"id": "Andheri", "type": "LOCATION", "color": "#2a9d8f", "score": 0.0}, {"id": "Suresh Nair", "type": "PERSON", "color": "#e63946", "score": 1.0}, {"id": "Andheri Warehouse", "type": "LOCATION", "color": "#2a9d8f", "score": 0.0}, {"id": "Ravi Malhotra", "type": "PERSON", "color": "#e63946", "score": 0.9348}, {"id": "Global Traders Pvt Ltd", "type": "ORG", "color": "#457b9d", "score": 0.7439}, {"id": "9123456789", "type": "PHONE", "color": "#8d99ae", "score": 0.0}, {"id": "INR 950000", "type": "MONEY", "color": "#6a4c93", "score": 0.0}, {"id": "Ajay Kulkarni", "type": "PERSON", "color": "#e63946", "score": 0.5406}, {"id": "Deepak Shah", "type": "PERSON", "color": "#e63946", "score": 0.9689}, {"id": "9988776655", "type": "PHONE", "color": "#8d99ae", "score": 0.0}, {"id": "MH14CD5678", "type": "VEHICLE", "color": "#f4a261", "score": 0.0}, {"id": "9871234567", "type": "PHONE", "color": "#8d99ae", "score": 0.0}, {"id": "Vikram Rao", "type": "PERSON", "color": "#e63946", "score": 0.3131}], "links": [{"source": "MH12AB1234", "target": "9876543210", "weight": 1}, {"source": "MH12AB1234", "target": "Andheri", "weight": 2}, {"source": "MH12AB1234", "target": "Suresh Nair", "weight": 3}, {"source": "MH12AB1234", "target": "Andheri Warehouse", "weight": 1}, {"source": "MH12AB1234", "target": "Ravi Malhotra", "weight": 2}, {"source": "MH12AB1234", "target": "Global Traders Pvt Ltd", "weight": 2}, {"source": "MH12AB1234", "target": "Ajay Kulkarni", "weight": 1}, {"source": "MH12AB1234", "target": "Deepak Shah", "weight": 1}, {"source": "9876543210", "target": "Andheri", "weight": 1}, {"source": "9876543210", "target": "Suresh Nair", "weight": 2}, {"source": "9876543210", "target": "Andheri Warehouse", "weight": 1}, {"source": "9876543210", "target": "Ravi Malhotra", "weight": 1}, {"source": "9876543210", "target": "9123456789", "weight": 2}, {"source": "9876543210", "target": "9988776655", "weight": 2}, {"source": "9876543210", "target": "Deepak Shah", "weight": 1}, {"source": "9876543210", "target": "9871234567", "weight": 1}, {"source": "Andheri", "target": "Suresh Nair", "weight": 3}, {"source": "Andheri", "target": "Andheri Warehouse", "weight": 3}, {"source": "Andheri", "target": "Ravi Malhotra", "weight": 3}, {"source": "Andheri", "target": "Global Traders Pvt Ltd", "weight": 2}, {"source": "Andheri", "target": "INR 950000", "weight": 1}, {"source": "Andheri", "target": "Deepak Shah", "weight": 1}, {"source": "Andheri", "target": "Vikram Rao", "weight": 1}, {"source": "Andheri", "target": "9871234567", "weight": 1}, {"source": "Suresh Nair", "target": "Andheri Warehouse", "weight": 1}, {"source": "Suresh Nair", "target": "Ravi Malhotra", "weight": 2}, {"source": "Suresh Nair", "target": "Global Traders Pvt Ltd", "weight": 2}, {"source": "Suresh Nair", "target": "9123456789", "weight": 1}, {"source": "Suresh Nair", "target": "INR 950000", "weight": 1}, {"source": "Suresh Nair", "target": "Ajay Kulkarni", "weight": 1}, {"source": "Suresh Nair", "target": "Deepak Shah", "weight": 1}, {"source": "Andheri Warehouse", "target": "Ravi Malhotra", "weight": 3}, {"source": "Andheri Warehouse", "target": "Deepak Shah", "weight": 1}, {"source": "Andheri Warehouse", "target": "Global Traders Pvt Ltd", "weight": 1}, {"source": "Andheri Warehouse", "target": "Vikram Rao", "weight": 1}, {"source": "Andheri Warehouse", "target": "9871234567", "weight": 1}, {"source": "Ravi Malhotra", "target": "Ajay Kulkarni", "weight": 1}, {"source": "Ravi Malhotra", "target": "Deepak Shah", "weight": 2}, {"source": "Ravi Malhotra", "target": "Global Traders Pvt Ltd", "weight": 2}, {"source": "Ravi Malhotra", "target": "Vikram Rao", "weight": 1}, {"source": "Ravi Malhotra", "target": "9871234567", "weight": 1}, {"source": "Global Traders Pvt Ltd", "target": "Ajay Kulkarni", "weight": 2}, {"source": "Global Traders Pvt Ltd", "target": "Deepak Shah", "weight": 3}, {"source": "Global Traders Pvt Ltd", "target": "MH14CD5678", "weight": 1}, {"source": "9123456789", "target": "9871234567", "weight": 1}, {"source": "9123456789", "target": "9988776655", "weight": 1}, {"source": "Ajay Kulkarni", "target": "Deepak Shah", "weight": 2}, {"source": "Ajay Kulkarni", "target": "MH14CD5678", "weight": 1}, {"source": "Deepak Shah", "target": "9988776655", "weight": 1}, {"source": "Deepak Shah", "target": "MH14CD5678", "weight": 1}, {"source": "9988776655", "target": "9871234567", "weight": 1}, {"source": "9871234567", "target": "Vikram Rao", "weight": 1}]};

const svg = d3.select("svg");
const width = window.innerWidth, height = window.innerHeight - 90;
const tooltip = d3.select("#tooltip");

const sim = d3.forceSimulation(graph.nodes)
  .force("link", d3.forceLink(graph.links).id(d => d.id).distance(90).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-260))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collide", d3.forceCollide(d => 8 + d.score*30));

const link = svg.append("g").selectAll("line")
  .data(graph.links).join("line")
  .attr("class","link")
  .attr("stroke-width", d => Math.min(1 + d.weight*1.5, 8));

const node = svg.append("g").selectAll("g")
  .data(graph.nodes).join("g")
  .call(d3.drag()
    .on("start", (e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", d => 6 + d.score*28)
  .attr("fill", d => d.color)
  .attr("stroke", "#fff").attr("stroke-width", 1)
  .on("mouseover", (e,d) => {
      tooltip.style("opacity",1)
        .html(`<b>${d.id}</b><br/>type: ${d.type}<br/>influence score: ${d.score.toFixed(3)}`);
  })
  .on("mousemove", (e) => tooltip.style("left", (e.pageX+12)+"px").style("top",(e.pageY+8)+"px"))
  .on("mouseout", () => tooltip.style("opacity",0));

node.append("text")
  .attr("dy", -12).attr("text-anchor","middle")
  .text(d => d.id);

sim.on("tick", () => {
  link.attr("x1", d=>d.source.x).attr("y1", d=>d.source.y)
      .attr("x2", d=>d.target.x).attr("y2", d=>d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
</body>
</html>
